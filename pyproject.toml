[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheets-data-validation-kit"
version = "0.1.0"
description = "Validation, reconciliation and entity-resolution primitives for spreadsheet and CSV pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
